<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark light" />
<title>Magic Wand — Magical Cursor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23a78bfa' d='M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z'/%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent !important;
    overflow: hidden;
    cursor: none;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #fx {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  #wand {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 2;
    width: 120px;
    height: 100px;
    pointer-events: none;
    will-change: transform;
    transform-origin: 10px 50px;
    filter:
      drop-shadow(0 0 10px rgba(167, 139, 250, 0.55))
      drop-shadow(0 0 26px rgba(167, 139, 250, 0.28));
    transition: opacity 0.35s ease;
    opacity: 1;
  }
  #wand.hidden-wand { opacity: 0; }
  #wand svg { display: block; overflow: visible; }

  #orb { transform-box: fill-box; transform-origin: center; animation: orbPulse 1.6s ease-in-out infinite; }
  @keyframes orbPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.22); opacity: 0.85; }
  }
  #tipspark { transform-box: fill-box; transform-origin: center; animation: sparkSpin 5s linear infinite; }
  @keyframes sparkSpin { to { transform: rotate(360deg); } }

  #hint {
    position: fixed;
    left: 50%;
    bottom: 28px;
    z-index: 3;
    transform: translateX(-50%);
    pointer-events: none;
    transition: opacity 0.8s ease, transform 0.8s ease;
    white-space: nowrap;
  }
  #hint.gone { opacity: 0; transform: translateX(-50%) translateY(10px); }
</style>
</head>
<body>

<canvas id="fx"></canvas>

<div id="wand" aria-hidden="true">
  <svg width="120" height="100" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="rodG" x1="8" y1="50" x2="100" y2="50" gradientUnits="userSpaceOnUse">
        <stop stop-color="#2b1746"/>
        <stop offset="0.55" stop-color="#1c1030"/>
        <stop offset="1" stop-color="#0e0818"/>
      </linearGradient>
      <linearGradient id="goldG" x1="0" y1="43" x2="0" y2="57" gradientUnits="userSpaceOnUse">
        <stop stop-color="#fde68a"/>
        <stop offset="0.5" stop-color="#f59e0b"/>
        <stop offset="1" stop-color="#b45309"/>
      </linearGradient>
      <radialGradient id="orbGlow" cx="0.5" cy="0.5" r="0.5">
        <stop stop-color="#ffffff" stop-opacity="0.95"/>
        <stop offset="0.25" stop-color="#e9d5ff" stop-opacity="0.8"/>
        <stop offset="0.6" stop-color="#a78bfa" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- handle body (tapered) -->
    <path d="M10 45.6 L95 48.1 Q103 50 95 51.9 L10 54.4 Q5.5 52.2 5.5 50 Q5.5 47.8 10 45.6 Z" fill="url(#rodG)"/>
    <path d="M12 47.9 L94 49.9" stroke="rgba(255,255,255,0.30)" stroke-width="1.4" stroke-linecap="round"/>

    <!-- pommel -->
    <circle cx="8.5" cy="50" r="5" fill="#150c26"/>
    <circle cx="8.5" cy="50" r="5" stroke="url(#goldG)" stroke-width="1.4"/>

    <!-- gold collars -->
    <rect x="82" y="43.6" width="6" height="12.8" rx="2" fill="url(#goldG)"/>
    <rect x="91" y="45" width="4.6" height="10" rx="1.6" fill="url(#goldG)"/>

    <!-- tip orb + glow -->
    <circle cx="106" cy="50" r="14" fill="url(#orbGlow)"/>
    <g id="orb">
      <circle cx="106" cy="50" r="4.6" fill="#ffffff"/>
      <circle cx="106" cy="50" r="4.6" stroke="#e9d5ff" stroke-width="1.2"/>
    </g>

    <!-- tiny spinning spark at the tip -->
    <g id="tipspark" stroke="#fef3c7" stroke-width="1.6" stroke-linecap="round">
      <path d="M106 36.5 v4.5 M106 59 v4.5 M92.5 50 h4.5 M115 50 h4.5"/>
    </g>
  </svg>
</div>

<div id="hint" class="flex items-center gap-2.5 px-4 py-2 rounded-full bg-[rgba(14,10,26,0.6)] backdrop-blur-md border border-white/10 text-white/80 font-[500] tracking-[0.16em] uppercase text-[10px]">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l1.7 4.9L18.6 9.6l-4.9 1.7L12 16.2l-1.7-4.9L5.4 9.6l4.9-1.7z"/>
    <path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>
  </svg>
  <span>Двигай мышью — колдуй &nbsp;·&nbsp; Зажми — заряди всплеск</span>
</div>

<script>
(() => {
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.45 : 1;

  // ---- palette
  const GOLD   = [[255, 214, 128], [255, 233, 176]];
  const VIOLET = [[196, 181, 253], [150, 110, 249]];
  const PINK   = [[249, 168, 212], [244, 114, 182]];
  const CYAN   = [[165, 243, 252], [103, 232, 249]];
  const WHITE  = [[255, 255, 255]];
  const PALETTE = [...GOLD, ...GOLD, ...VIOLET, ...VIOLET, ...VIOLET, ...PINK, ...CYAN, ...CYAN, ...WHITE];

  // ---- canvas
  const cvs = document.getElementById('fx');
  const ctx = cvs.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cvs.width = Math.round(W * dpr);
    cvs.height = Math.round(H * dpr);
    cvs.style.width = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // ---- wand state
  const wandEl = document.getElementById('wand');
  const hintEl = document.getElementById('hint');
  const T  = { x: W / 2, y: H / 2 };          // target (cursor)
  const P  = { x: W / 2, y: H / 2 };          // springed handle
  const V  = { x: 0, y: 0 };                  // spring velocity
  let dirX = Math.SQRT1_2, dirY = -Math.SQRT1_2;
  let speed = 0, interacted = false, hasPointer = false;
  let charge = 0, charging = false, flash = 0, kickA = 0;
  let travel = 0;

  // ---- particles
  const dust = [], stars = [], rings = [], seals = [], orbs = [], trail = [];

  function emitDust(x, y, vx, vy, size, life, c) {
    if (dust.length > 520) dust.splice(0, dust.length - 520);
    dust.push({
      x, y, vx, vy, size, life, age: 0, c,
      twF: rand(6, 16), twP: rand(0, TAU)
    });
  }

  function emitStar(x, y, r, vx = 0, vy = 0, c = null) {
    if (stars.length > 140) stars.shift();
    stars.push({
      x, y, vx, vy, r, c: c || pick(PALETTE),
      age: 0, life: rand(0.55, 1.15),
      rot: rand(0, TAU), rotV: rand(-3.5, 3.5)
    });
  }

  function spawnSeal(x, y, power) {
    seals.push({ x, y, power, age: 0, life: 1.7, rot: rand(0, TAU) });
  }

  function spawnBurst(x, y, power) {
    const P2 = Math.min(1, Math.max(0.15, power));
    flash = Math.min(1, 0.4 + P2 * 0.8);
    kickA = (Math.random() < 0.5 ? -1 : 1) * (3 + 7 * P2);
    V.x -= dirX * 260 * P2; V.y -= dirY * 260 * P2;

    rings.push({ x, y, age: 0, life: 0.75, maxR: 120 + 190 * P2, c: VIOLET[0], w: 6 });
    rings.push({ x, y, age: 0, life: 0.6, maxR: 60 + 90 * P2, c: GOLD[0], w: 3.5 });
    if (P2 > 0.4) spawnSeal(x, y, P2);

    const n = Math.round((26 + 140 * P2) * reduceMotion);
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU);
      const sp = rand(50, 300) * (0.45 + P2);
      emitDust(x + Math.cos(a) * 4, y + Math.sin(a) * 4,
        Math.cos(a) * sp, Math.sin(a) * sp - rand(0, 60),
        rand(0.9, 2.8), rand(0.5, 1.4), pick(PALETTE));
    }
    const ns = Math.round((4 + 12 * P2) * reduceMotion);
    for (let i = 0; i < ns; i++) {
      const a = rand(0, TAU);
      const sp = rand(30, 170) * (0.5 + P2);
      emitStar(x, y, rand(3, 9.5), Math.cos(a) * sp, Math.sin(a) * sp);
    }
    for (const o of orbs) {
      const ox = o.px, oy = o.py;
      const a = rand(0, TAU);
      const sp = rand(120, 420) * (0.5 + P2);
      emitDust(ox, oy, Math.cos(a) * sp, Math.sin(a) * sp, rand(1.2, 3), rand(0.6, 1.2), o.c);
    }
    orbs.length = 0;
  }

  // ---- input
  addEventListener('pointermove', e => {
    T.x = e.clientX; T.y = e.clientY;
    hasPointer = true;
    wandEl.classList.remove('hidden-wand');
    if (!interacted) { interacted = true; hintEl.classList.add('gone'); }
  }, { passive: true });

  addEventListener('pointerdown', e => {
    T.x = e.clientX; T.y = e.clientY;
    charging = true; charge = 0;
    if (!interacted) { interacted = true; hintEl.classList.add('gone'); }
  });

  function release(power) {
    if (!charging) return;
    charging = false;
    spawnBurst(tipX, tipY, power);
  }
  addEventListener('pointerup', () => release(0.18 + charge * 0.85));
  addEventListener('pointercancel', () => { charging = false; orbs.length = 0; });
  addEventListener('blur', () => { charging = false; orbs.length = 0; });
  document.addEventListener('pointerleave', () => { hasPointer = false; wandEl.classList.add('hidden-wand'); });
  document.addEventListener('pointerenter', () => { wandEl.classList.remove('hidden-wand'); });
  addEventListener('contextmenu', e => e.preventDefault());

  // ---- drawing helpers
  let tipX = W / 2 + 60, tipY = H / 2 - 60;

  function glow(x, y, R, inner, outer, a) {
    if (R < 0.5 || a <= 0.01) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, rgba(inner, a));
    g.addColorStop(0.35, rgba(outer, a * 0.45));
    g.addColorStop(1, rgba(outer, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, R, 0, TAU);
    ctx.fill();
  }

  function star4(x, y, r, rot, c, a) {
    if (r < 0.2) return;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const ang = rot + i * Math.PI / 4;
      const rr = (i % 2 ? 0.22 : 1) * r;
      i === 0 ? ctx.moveTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr)
              : ctx.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = rgba(c, a);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, r * 0.28, 0, TAU);
    ctx.fillStyle = rgba(WHITE[0], a * 0.95);
    ctx.fill();
  }

  function drawSeal(s, e) {
    const alpha = Math.pow(1 - e, 1.4) * 0.85;
    const sc = 0.55 + 0.65 * (1 - Math.pow(1 - e, 3));
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot + e * 1.1);
    ctx.scale(sc, sc);
    ctx.strokeStyle = rgba(GOLD[0], alpha);
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(0, 0, 46, 0, TAU); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.stroke();
    // ticks
    ctx.strokeStyle = rgba(GOLD[1], alpha * 0.8);
    for (let i = 0; i < 24; i++) {
      const a = i * TAU / 24;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 46, Math.sin(a) * 46);
      ctx.lineTo(Math.cos(a) * 50.5, Math.sin(a) * 50.5);
      ctx.stroke();
    }
    // pentagram
    ctx.strokeStyle = rgba(VIOLET[0], alpha);
    ctx.lineWidth = 1.2;
    const pts = [];
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * TAU / 5;
      pts.push([Math.cos(a) * 28, Math.sin(a) * 28]);
    }
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = pts[i], b = pts[(i + 2) % 5];
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    }
    ctx.stroke();
    ctx.restore();
  }

  // ---- main loop
  let last = performance.now();
  let orbTimer = 0, idleTimer = 0;

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.033) dt = 0.033;
    const t = now / 1000;

    // spring toward cursor
    const k = 160, d = 16;
    const ax = (T.x - P.x) * k - V.x * d;
    const ay = (T.y - P.y) * k - V.y * d;
    V.x += ax * dt; V.y += ay * dt;
    P.x += V.x * dt; P.y += V.y * dt;

    const dx = T.x - P.x, dy = T.y - P.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 2) {
      const nx = dx / dist, ny = dy / dist;
      const m = 1 - Math.exp(-12 * dt);
      dirX += (nx - dirX) * m; dirY += (ny - dirY) * m;
      const l = Math.hypot(dirX, dirY) || 1;
      dirX /= l; dirY /= l;
    }
    const inst = dist / Math.max(dt, 0.0008);
    speed += (inst - speed) * (1 - Math.exp(-8 * dt));

    kickA *= Math.exp(-6 * dt);
    flash *= Math.exp(-3.4 * dt);

    // wand pose
    if (charging) charge = Math.min(1, charge + dt / 1.0);
    const shiver = charge > 0.92 ? Math.sin(t * 80) * 1.4 : 0;
    const buttX = P.x - dirX * 18 + shiver;
    const buttY = P.y - dirY * 18 + shiver;
    tipX = buttX + dirX * 96;
    tipY = buttY + dirY * 96;

    const wobAmp = clamp(speed / 1400, 0, 1) * 5 + 1.6;
    let ang = Math.atan2(dirY, dirX) * 180 / Math.PI
      + Math.sin(t * 9) * wobAmp
      + Math.sin(t * 1.7) * 2.5
      + kickA;
    const scale = 1 + charge * 0.09;

    wandEl.style.transform =
      `translate3d(${(buttX - 10).toFixed(2)}px, ${(buttY - 50).toFixed(2)}px, 0) rotate(${ang.toFixed(2)}deg) scale(${scale.toFixed(3)})`;

    // ---- emit while moving: the wand casts as you wave it
    const perpX = -dirY, perpY = dirX;
    const emitK = (hasPointer ? 1 : 0) * reduceMotion;
    if (speed > 18) {
      let nF = speed * dt * 0.24 * emitK;
      let n = Math.floor(nF) + (Math.random() < nF % 1 ? 1 : 0);
      n = Math.min(n, 12);
      for (let i = 0; i < n; i++) {
        const j = rand(-12, 12);
        emitDust(
          tipX + perpX * j + dirX * rand(-6, 4),
          tipY + perpY * j + dirY * rand(-6, 4),
          -dirX * rand(20, 80) + perpX * rand(-45, 45) + V.x * 0.12 + rand(-25, 25),
          -dirY * rand(20, 80) + perpY * rand(-45, 45) + V.y * 0.12 + rand(-25, 25),
          rand(0.8, 2.4), rand(0.5, 1.35), pick(PALETTE)
        );
      }
      travel += speed * dt;
      if (travel > 30 && emitK) {
        travel = 0;
        const j = rand(-9, 9), back = rand(0, 42);
        const r = Math.random() < 0.16 ? rand(6, 10) : rand(2.2, 4.6);
        emitStar(tipX - dirX * back + perpX * j, tipY - dirY * back + perpY * j, r);
      }
      if (trail.length < 90) trail.push({ x: tipX, y: tipY, age: 0, life: 0.45 });
    }
    idleTimer += dt;
    if (idleTimer > 0.9 && speed < 10) { // gentle idle shimmer
      idleTimer = 0;
      emitStar(tipX + rand(-10, 10), tipY + rand(-10, 10), rand(1.6, 3.2));
    }

    // charge spiral
    if (charging) {
      orbTimer += dt;
      while (orbTimer > 0.026) {
        orbTimer -= 0.026;
        if (orbs.length < 46 * reduceMotion) {
          orbs.push({
            ang: rand(0, TAU), rad: rand(42, 58),
            orbV: rand(2.6, 4.6) * (Math.random() < 0.5 ? 1 : -1),
            radV: -(34 + 60 * charge + rand(0, 20)),
            c: pick(PALETTE), size: rand(1.6, 3), px: tipX, py: tipY
          });
        }
      }
    }

    // ---- integrate
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.age += dt;
      if (p.age >= p.life) { dust.splice(i, 1); continue; }
      const dr = Math.exp(-2.1 * dt);
      p.vx *= dr; p.vy = p.vy * dr - 14 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.age += dt;
      if (s.age >= s.life) { stars.splice(i, 1); continue; }
      s.rot += s.rotV * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.vx *= Math.exp(-2.4 * dt); s.vy *= Math.exp(-2.4 * dt);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].age += dt;
      if (rings[i].age >= rings[i].life) rings.splice(i, 1);
    }
    for (let i = seals.length - 1; i >= 0; i--) {
      seals[i].age += dt;
      if (seals[i].age >= seals[i].life) seals.splice(i, 1);
    }
    for (let i = trail.length - 1; i >= 0; i--) {
      trail[i].age += dt;
      if (trail[i].age >= trail[i].life) trail.splice(i, 1);
    }
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      o.ang += o.orbV * dt;
      o.rad += o.radV * dt;
      o.px = tipX + Math.cos(o.ang) * o.rad;
      o.py = tipY + Math.sin(o.ang) * o.rad;
      if (o.rad < 5) {
        emitDust(o.px, o.py, rand(-30, 30), rand(-40, 10), 1.2, 0.35, o.c);
        orbs.splice(i, 1);
      }
    }

    // ---- render

    // trail ribbon
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i - 1], b = trail[i];
      const lf = 1 - b.age / b.life;
      const hue = (258 + i * 2.2 + t * 40) % 360;
      ctx.strokeStyle = `hsla(${hue}, 92%, 72%, ${(lf * 0.55).toFixed(3)})`;
      ctx.lineWidth = Math.max(0.4, 9 * lf * lf * (1 + clamp(speed / 900, 0, 1)));
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }

    // magic seals
    for (const s of seals) drawSeal(s, s.age / s.life);

    // tip glow
    const gR = 24 + clamp(speed * 0.05, 0, 40) + charge * 42 + flash * 200 + Math.sin(t * 5) * 2;
    glow(tipX, tipY, gR, WHITE[0], VIOLET[1], 0.12 + charge * 0.22 + flash * 0.4);
    glow(tipX, tipY, 12 + charge * 12 + flash * 24, WHITE[0], GOLD[1], 0.5);

    // dust
    for (const p of dust) {
      const e = p.age / p.life;
      const tw = 0.65 + 0.35 * Math.sin(p.twF * t + p.twP);
      const a = Math.pow(1 - e, 1.2) * tw;
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > 130) {
        ctx.strokeStyle = rgba(p.c, a * 0.55);
        ctx.lineWidth = p.size * 0.9;
        ctx.beginPath();
        ctx.moveTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }
      ctx.fillStyle = rgba(p.c, a * 0.16);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 3, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba(p.c, a);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    }

    // charge orbs
    for (const o of orbs) {
      ctx.fillStyle = rgba(o.c, 0.85);
      ctx.beginPath(); ctx.arc(o.px, o.py, o.size, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba(o.c, 0.18);
      ctx.beginPath(); ctx.arc(o.px, o.py, o.size * 3.4, 0, TAU); ctx.fill();
    }

    // sparkle stars
    for (const s of stars) {
      const e = s.age / s.life;
      const pop = Math.sin(Math.PI * Math.min(1, e));
      const tw = 0.72 + 0.28 * Math.sin(t * 14 + s.rotV * 10);
      star4(s.x, s.y, s.r * pop * tw, s.rot, s.c, Math.pow(1 - e, 0.7) * 0.95);
    }

    // shock rings
    for (const r of rings) {
      const e = r.age / r.life;
      const R = Math.max(0.5, e * r.maxR);
      ctx.strokeStyle = rgba(r.c, Math.pow(1 - e, 2) * 0.8);
      ctx.lineWidth = Math.max(0.6, r.w * (1 - e));
      ctx.beginPath(); ctx.arc(r.x, r.y, R, 0, TAU); ctx.stroke();
    }

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  // welcome shimmer
  setTimeout(() => spawnBurst(W / 2, H / 2, 0.22), 650);
})();
</script>
</body>
